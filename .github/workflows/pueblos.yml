name: Lista de pueblos

on:
  schedule:
    # Una vez al mes: los pueblos casi no cambian.
    - cron: "17 4 3 * *"
  workflow_dispatch:

jobs:
  pueblos:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r scripts/requirements.txt
      - name: Descargar de GeoNames y subir a Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/pueblos.py
