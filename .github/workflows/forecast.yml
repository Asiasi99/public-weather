name: Pronóstico de modelos

on:
  schedule:
    # Cada hora, en un minuto poco concurrido: GitHub retrasa o se salta ejecuciones programadas, y así la
    # siguiente llega pronto. Un modelo cuya pasada ya está publicada no se descarga otra vez (tarda segundos).
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Descargar aunque la pasada ya esté publicada"
        type: boolean
        default: false
      models:
        description: "Solo estos modelos, separados por espacios (ifs aifs gfs icon-eu arpege arome ukmo gem). Vacío = todos"
        type: string
        default: ""

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/ml/requirements.txt

      # Las de la IA (scripts/ml) son para añadir la serie «ml»: si no hay IA entrenada, run.py publica sin ella.
      - run: pip install -r scripts/requirements.txt -r scripts/ml/requirements.txt

      # Lo leído de cada modelo en la rejilla de España (weather/grid.py), de la ejecución anterior:
      # así cada hora solo se lee el modelo que tiene pasada nueva y se mezclan todos.
      - name: Recuperar la caché de la rejilla
        uses: actions/cache/restore@v4
        with:
          path: out/grid-cache
          key: grid-${{ github.run_id }}
          restore-keys: grid-

      - name: Descargar, recortar y subir a Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Para «¿acertó la IA?»: lo medido cada día en AEMET (una petición cada 6 h).
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          MODELS: ${{ inputs.models }}
        run: |
          args=()
          [ "${{ inputs.force }}" = "true" ] && args+=(--force)
          [ -n "$MODELS" ] && args+=(--models $MODELS)
          python scripts/run.py "${args[@]}"

      - name: Guardar la caché de la rejilla
        if: always()
        uses: actions/cache/save@v4
        with:
          path: out/grid-cache
          key: grid-${{ github.run_id }}

      # Copia comprimida de todo cada 6 h, para entrenar la IA con tus propias previsiones en el futuro.
      # Si falla, el pronóstico ya está publicado: no se marca en rojo.
      - name: Archivar previsiones
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/ml/archivar.py
