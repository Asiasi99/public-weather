name: Pronóstico de modelos

on:
  schedule:
    # Cada hora, en un minuto poco concurrido: GitHub retrasa o se salta ejecuciones programadas, y así la
    # siguiente llega pronto. Un modelo cuya pasada ya está publicada no se descarga otra vez (tarda segundos).
    - cron: "41 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Descargar aunque la pasada ya esté publicada"
        type: boolean
        default: false
      models:
        description: "Solo estos modelos, separados por espacios (ifs aifs gfs icon-eu arpege arome ukmo gem). Vacío = todos"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: forecast
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/ml/requirements.txt

      # Las de la IA (scripts/ml) son para añadir la serie «ml»: si no hay IA entrenada, run.py publica sin ella.
      - run: pip install -r scripts/requirements.txt -r scripts/ml/requirements.txt

      - name: Descargar, recortar y subir a Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Para «¿acertó la IA?»: lo medido cada día en AEMET (una petición cada 6 h).
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          # Plan de pago de Open-Meteo (opcional): sin ella se usa el plan gratis, no comercial
          OPEN_METEO_KEY: ${{ secrets.OPEN_METEO_KEY }}
          MODELS: ${{ inputs.models }}
        run: |
          args=()
          [ "${{ inputs.force }}" = "true" ] && args+=(--force)
          [ -n "$MODELS" ] && args+=(--models $MODELS)
          python scripts/run.py "${args[@]}"

      # Copia comprimida de todo una vez al día (la primera ejecución del día), para entrenar la IA con tus datos.
      # Si falla, el pronóstico ya está publicado: no se marca en rojo.
      - name: Archivar previsiones
        if: always()
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/ml/archivar.py

  # GitHub se salta muchas ejecuciones programadas en repositorios con poca actividad.
  # Por eso cada ejecución deja lanzada la siguiente: espera al próximo minuto de la lista y se relanza.
  # El «cron» de arriba queda de reserva por si la cadena se corta. Si se juntan dos, «concurrency»
  # deja como mucho una esperando y cancela las demás, así que nunca se multiplican.
  siguiente:
    needs: [fetch]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 70
    permissions:
      actions: write
    steps:
      - name: Esperar y lanzar la siguiente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%M); now=$((10#$now)); best=99
          for m in 41; do d=$(( (m - now + 60) % 60 )); [ $d -lt 2 ] && d=$((d+60)); [ $d -lt $best ] && best=$d; done
          echo "Siguiente en $best min"
          sleep $((best*60 - $(date -u +%S | sed 's/^0//')))
          gh api -X POST repos/${{ github.repository }}/actions/workflows/forecast.yml/dispatches -f ref=main
