# GitHub pausa las tareas programadas de un repositorio público si pasan 60 días sin cambios.
# Esto deja una marca el día 15 de cada mes para que el pronóstico nunca se pare.
name: Mantener activo

on:
  schedule:
    - cron: "7 3 15 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vivo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +%Y-%m-%dT%H:%MZ > .vivo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .vivo
          git commit -m "Mantener activo" || exit 0
          git push
