name: Observado ahora

on:
  schedule:
    # Cada 30 minutos (a los 12 y a los 42 de cada hora): AEMET y los METAR publican su dato
    # nuevo poco después de cada hora y cada media hora.
    - cron: "12,42 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observado
  cancel-in-progress: false

jobs:
  observado:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Leer estaciones (AEMET + METAR) y subir observed.json
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/observado.py

  # GitHub se salta muchas ejecuciones programadas en repositorios con poca actividad.
  # Por eso cada ejecución deja lanzada la siguiente: espera al próximo minuto de la lista y se relanza.
  # El «cron» de arriba queda de reserva por si la cadena se corta. Si se juntan dos, «concurrency»
  # deja como mucho una esperando y cancela las demás, así que nunca se multiplican.
  siguiente:
    needs: [observado]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      actions: write
    steps:
      - name: Esperar y lanzar la siguiente
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          now=$(date -u +%M); now=$((10#$now)); best=99
          for m in 12 42; do d=$(( (m - now + 60) % 60 )); [ $d -lt 2 ] && d=$((d+60)); [ $d -lt $best ] && best=$d; done
          echo "Siguiente en $best min"
          sleep $((best*60 - $(date -u +%S | sed 's/^0//')))
          gh api -X POST repos/${{ github.repository }}/actions/workflows/observado.yml/dispatches -f ref=main
