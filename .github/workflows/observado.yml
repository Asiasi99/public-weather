name: Observado ahora

on:
  schedule:
    # Cada 30 minutos (a los 12 y a los 42 de cada hora): AEMET y los METAR publican su dato
    # nuevo poco después de cada hora y cada media hora.
    - cron: "12,42 * * * *"
  workflow_dispatch:

concurrency:
  group: observado
  cancel-in-progress: true

jobs:
  observado:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      - name: Leer estaciones (AEMET + METAR) y subir observed.json
        env:
          AEMET_API_KEY: ${{ secrets.AEMET_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python scripts/observado.py
